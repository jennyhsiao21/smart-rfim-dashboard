  { id:'new',          name:'New Customer',              short:'New',           tone:'active', count:1100,

  { id:'potential_new',name:'Potential New Customer',    short:'Potential New', tone:'risk',   count:640,
    rule:'First purchase · approaching lapse',
    action:'Hold onto first-timers', actionType:'re-engage', xy:{x:160,y:1}, recencyRange:'60–76 days', shade:'light',

    campaign:{ channel:'EMAIL', offer:'Personalised second-order pick',

  { id:'lost',         name:'Lost Customer',             short:'Lost',          tone:'lost',   count:4300,

    action:'Final win-back',      actionType:'win-back', xy:{x:350,y:2}, recencyRange:'114+ days', shade:'main',

const TOTAL_BASE = SEGMENTS.reduce((a,s)=>a+s.count,0);
const REPURCHASE_CYCLE = 38;

/* ---------- UTIL ---------- */
const fmt = (n) => n.toLocaleString('en-US');
const pct = (n) => (Math.round(n*10)/10).toFixed(1) + '%';

/* ---------- TYPEWRITER ---------- */
function useTypewriter(text, speed=14, run=true){
  const [out, setOut] = useState('');
  const [done, setDone] = useState(false);
  useEffect(()=>{
    if(!run){ setOut(''); setDone(false); return; }
    setOut(''); setDone(false);
    let i = 0;
    const id = setInterval(()=>{
      i += Math.max(1, Math.round(text.length/180)); // chunked for long text
      if(i >= text.length){ setOut(text); setDone(true); clearInterval(id); }
      else setOut(text.slice(0, i));
    }, speed);
    return ()=>clearInterval(id);
  }, [text, speed, run]);
  return [out, done];
}

/* ---------- SPARKLINE ---------- */
function Sparkline({ data, stroke='#0F1115', fill='rgba(15,17,21,0.06)', w=220, h=56 }){
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  const step = w / (data.length - 1);
  const points = data.map((v,i)=>[i*step, h - ((v-min)/span)*(h-8) - 4]);
  const d = points.map((p,i)=> (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${d} L ${w} ${h} L 0 ${h} Z`;
  const last = points[points.length-1];
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} className="block">
      <path d={area} fill={fill} />
      <path d={d} className="sparkpath" fill="none" stroke={stroke} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={last[0]} cy={last[1]} r="2.6" fill={stroke} />
    </svg>
  );
}

/* ---------- BUBBLE GRID ---------- */
// Pack bubbles in a 3-row grid; bubble area proportional to count.
function BubbleGrid({ selectedId, onSelect }){
  // Scale: max bubble diameter for largest count
  const maxC = Math.max(...SEGMENTS.map(s=>s.count));
  const minD = 86, maxD = 188;
  const sized = SEGMENTS.map(s=>{
    const r = Math.sqrt(s.count / maxC);
    const d = Math.round(minD + (maxD - minD) * r);
    return { ...s, d };
  });
  return (
    <div className="grid grid-cols-3 md:grid-cols-3 gap-x-4 gap-y-6 place-items-center">
      {sized.map(s => {
        const t = TONES[s.tone];
        const isSel = selectedId === s.id;
        return (
          <button
            key={s.id}
            onClick={()=>onSelect(s.id)}
            data-comment-anchor={`bubble-${s.id}`}
            className="bubble relative flex flex-col items-center justify-center rounded-full text-left focus:outline-none"
            style={{
              width: s.d, height: s.d,
              background: t.bg,
              outline: `${isSel ? 2 : 1}px solid ${isSel ? t.ring : 'rgba(15,17,21,0.06)'}`,
              outlineOffset: isSel ? 2 : 0,
              boxShadow: isSel ? `0 8px 24px ${t.ring}22` : '0 1px 0 rgba(15,17,21,0.04)',
            }}
          >
            <span className="num text-[15px] font-semibold" style={{ color: t.text }}>
              {fmt(s.count)}
            </span>
            <span className="text-[11px] mt-0.5 px-3 text-center leading-tight" style={{ color: t.text, opacity: .85 }}>
              {s.short}
            </span>
            <span className="num absolute -top-2 -right-1 text-[10px] px-1.5 py-0.5 rounded-full bg-white/90 hairline" style={{ color: t.text }}>
              {pct(s.count/TOTAL_BASE*100)}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ---------- RFIM SCATTER ---------- */
// Custom SVG scatter — recency on X, frequency on Y, bubble size = count.
// Coordinate system goes negative on left for axis labels and below for x-axis.
function RFIMScatter({ selectedId, onSelect, mood }){
  const W = 760, H = 460;
  const padL = 56, padR = 28, padT = 28, padB = 56;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const xMax = 400, yMax = 10;
  const sx = (x) => padL + (x / xMax) * innerW;
  const sy = (y) => padT + innerH - (y / yMax) * innerH;

  // Bubble radius scaled by sqrt(count)
  const counts = SEGMENTS.map(s=>s.count);
  const cMax = Math.max(...counts);
  const rMin = 16, rMax = 52;
  const rOf = (count) => rMin + (rMax - rMin) * Math.sqrt(count / cMax);

  const colorOf = (s) => {
    if (s.id === 'engaged')      return { fill:'#D6F1EE', stroke:'#0D8C82', text:'#0A6962' };          // teal
    if (s.id === 'lost')         return { fill:'#FBE3E1', stroke:'#C8392E', text:'#7A1F18' };          // red
    if (s.tone === 'top')        return { fill:'#E8EEFE', stroke:'#3B5BFB', text:'#1B2A78' };          // blue
    if (s.tone === 'risk' && s.shade==='light') return { fill:'#FBEFD9', stroke:'#C68A14', text:'#6A4708' }; // amber light
    if (s.tone === 'risk')       return { fill:'#F6DFAA', stroke:'#B07810', text:'#553905' };          // amber main
    if (s.tone === 'active' && s.shade==='light') return { fill:'#EAF6EE', stroke:'#3FA56F', text:'#1F6E45' }; // green light
    return { fill:'#D7EFDF', stroke:'#1F8A5B', text:'#0E5235' };                                       // green main
  };

  const xThresholds = [
    { x: 80,  label: 'Recently purchased',     align:'end' },
    { x: 120, label: 'Ready to repurchase',    align:'middle' },
    { x: 300, label: 'Lapsed',                 align:'start' },
  ];
  const yThresholds = [
    { y: 1, label: 'Repeat buyer' },
    { y: 5, label: 'Top tier' },
  ];

  const xTicks = [0, 80, 120, 200, 300, 400];
  const yTicks = [0, 1, 3, 5, 7, 10];

  // Zone fills (very faint)
  const zones = [
    { x1:0,   x2:80,  fill:'rgba(31,138,91,0.07)',  label:'Active zone',       lx:6,    ly:14 },
    { x1:80,  x2:300, fill:'rgba(198,138,20,0.06)', label:'Intervention zone', lx:null, ly:14 },
    { x1:300, x2:400, fill:'rgba(200,57,46,0.07)',  label:'Win-back zone',     lx:'r',  ly:14 },
  ];

  const [hoverId, setHoverId] = useState(null);
  const hovered = hoverId ? SEGMENTS.find(s=>s.id===hoverId) : null;

  const dark = mood === 'midnight';
  const axisColor = dark ? 'rgba(244,241,236,0.5)' : 'rgba(15,17,21,0.55)';
  const axisFaint = dark ? 'rgba(244,241,236,0.12)' : 'rgba(15,17,21,0.10)';
  const axisLabel = dark ? 'rgba(244,241,236,0.85)' : 'rgba(15,17,21,0.85)';
  const gridColor = dark ? 'rgba(244,241,236,0.06)' : 'rgba(15,17,21,0.04)';

  return (
    <div className="relative">
      {/* Cycle badge */}
      <div className="absolute top-3 left-3 z-10 num text-[11px] px-2.5 py-1 rounded-full"
        style={{
          background: dark ? 'rgba(244,241,236,0.10)' : 'rgba(15,17,21,0.04)',
          color: axisLabel,
          border: `1px solid ${axisFaint}`,
        }}>
        Repurchase cycle: <span className="font-semibold">{REPURCHASE_CYCLE} days</span> — thresholds calculated automatically.
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block" style={{ maxHeight: 520 }}>
        {/* Zone shading */}
        {zones.map((z, i) => (
          <rect key={i} x={sx(z.x1)} y={padT} width={sx(z.x2)-sx(z.x1)} height={innerH} fill={z.fill} />
        ))}

        {/* Zone labels */}
        <text x={sx(0)+10}    y={padT+18} fontSize="10.5" fontFamily="JetBrains Mono, monospace"
              fill={axisColor} style={{letterSpacing:'.08em'}}>{zones[0].label.toUpperCase()}</text>
        <text x={sx(190)}     y={padT+18} fontSize="10.5" fontFamily="JetBrains Mono, monospace"
              fill={axisColor} textAnchor="middle" style={{letterSpacing:'.08em'}}>{zones[1].label.toUpperCase()}</text>
        <text x={sx(400)-10}  y={padT+18} fontSize="10.5" fontFamily="JetBrains Mono, monospace"
              fill={axisColor} textAnchor="end" style={{letterSpacing:'.08em'}}>{zones[2].label.toUpperCase()}</text>

        {/* Y gridlines + ticks */}
        {yTicks.map(yt => (
          <g key={'y'+yt}>
            <line x1={padL} x2={W-padR} y1={sy(yt)} y2={sy(yt)} stroke={gridColor} />
            <text x={padL-10} y={sy(yt)+3} fontSize="10.5" textAnchor="end"
                  fontFamily="JetBrains Mono, monospace" fill={axisColor}>{yt}{yt===10?'+':''}</text>
          </g>
        ))}

        {/* X ticks */}
        {xTicks.map(xt => (
          <g key={'x'+xt}>
            <line x1={sx(xt)} x2={sx(xt)} y1={H-padB} y2={H-padB+5} stroke={axisColor} />
            <text x={sx(xt)} y={H-padB+18} fontSize="10.5" textAnchor="middle"
                  fontFamily="JetBrains Mono, monospace" fill={axisColor}>{xt}%</text>
          </g>
        ))}

        {/* Y threshold lines */}
        {yThresholds.map(t => (
          <g key={'yt'+t.y}>
            <line x1={padL} x2={W-padR} y1={sy(t.y)} y2={sy(t.y)}
                  stroke={axisColor} strokeDasharray="3 4" strokeWidth="1" opacity=".55" />
            <text x={W-padR-6} y={sy(t.y)-4} fontSize="9.5" textAnchor="end"
                  fontFamily="JetBrains Mono, monospace" fill={axisColor}
                  style={{letterSpacing:'.08em'}}>{t.label.toUpperCase()}</text>
          </g>
        ))}

        {/* X threshold lines */}
        {xThresholds.map(t => (
          <g key={'xt'+t.x}>
            <line x1={sx(t.x)} x2={sx(t.x)} y1={padT} y2={H-padB}
                  stroke={axisColor} strokeDasharray="3 4" strokeWidth="1" opacity=".55" />
            <text x={sx(t.x) + (t.align==='end'?-6:t.align==='start'?6:0)}
                  y={H-padB-6}
                  fontSize="9.5"
                  textAnchor={t.align}
                  fontFamily="JetBrains Mono, monospace"
                  fill={axisColor}
                  style={{letterSpacing:'.08em'}}>{t.label.toUpperCase()}</text>
          </g>
        ))}

        {/* Axis frame */}
        <line x1={padL} x2={W-padR} y1={H-padB} y2={H-padB} stroke={axisColor} />
        <line x1={padL} x2={padL}   y1={padT}   y2={H-padB} stroke={axisColor} />

        {/* Axis titles */}
        <text x={padL + innerW/2} y={H-12} fontSize="11.5" textAnchor="middle"
              fontFamily="Inter Tight, sans-serif" fill={axisLabel} fontWeight="500">
          Recency (% of {REPURCHASE_CYCLE}-day purchase cycle)
        </text>
        <g transform={`translate(${14}, ${padT + innerH/2}) rotate(-90)`}>
          <text fontSize="11.5" textAnchor="middle" fontFamily="Inter Tight, sans-serif"
                fill={axisLabel} fontWeight="500">Frequency · lifetime purchase count</text>
        </g>

        {/* Pulsing ring for priority bubble (Inactive Top) */}
        {SEGMENTS.filter(s=>s.priority).map(s=>{
          const r = rOf(s.count);
          const cx = sx(s.xy.x), cy = sy(s.xy.y);
          return (
            <g key={'pulse-'+s.id} style={{ pointerEvents:'none' }}>
              <circle cx={cx} cy={cy} r={r} fill="none" stroke="#3B5BFB" strokeWidth="1.5" opacity=".5">
                <animate attributeName="r" from={r} to={r+18} dur="1.8s" repeatCount="indefinite" />
                <animate attributeName="opacity" from=".5" to="0" dur="1.8s" repeatCount="indefinite" />
              </circle>
            </g>
          );
        })}

        {/* Bubbles (sorted: largest first so smaller sit on top) */}
        {[...SEGMENTS].sort((a,b)=>b.count-a.count).map(s => {
          const r = rOf(s.count);
          const cx = sx(s.xy.x), cy = sy(s.xy.y);
          const c = colorOf(s);
          const isSel = selectedId === s.id;
          const isHov = hoverId === s.id;
          const showLabel = r >= 28 || isHov || isSel;

          return (
            <g key={s.id}
               style={{ cursor:'pointer' }}
               onMouseEnter={()=>setHoverId(s.id)}
               onMouseLeave={()=>setHoverId(null)}
               onClick={()=>onSelect(s.id)}>
              {/* Engaged interaction ring */}
              {s.interaction && (
                <circle cx={cx} cy={cy} r={r+5} fill="none"
                        stroke={c.stroke} strokeOpacity=".35" strokeDasharray="2 3" strokeWidth="1"/>
              )}
              <circle
                cx={cx} cy={cy} r={r}
                fill={c.fill}
                stroke={c.stroke}
                strokeWidth={isSel ? 2.5 : (s.priority ? 1.5 : 1)}
                strokeDasharray={s.priority ? '4 3' : 'none'}
                style={{ transition:'transform .15s ease', filter: isSel ? `drop-shadow(0 4px 14px ${c.stroke}55)` : 'none' }}
              />
              {showLabel && (
                <>
                  <text
                    x={cx} y={cy-1}
                    fontSize={r >= 36 ? 12 : 11}
                    textAnchor="middle"
                    fontFamily="Inter Tight, sans-serif"
                    fontWeight="600"
                    fill={c.text}>
                    {s.short}
                  </text>
                  <text
                    x={cx} y={cy+12}
                    fontSize={r >= 36 ? 10.5 : 9.5}
                    textAnchor="middle"
                    fontFamily="JetBrains Mono, monospace"
                    fill={c.text}
                    opacity=".8">
                    {fmt(s.count)}
                  </text>
                </>
              )}
            </g>
          );
        })}
      </svg>

      {/* Hover tooltip */}
      {hovered && (
        <div className="absolute pointer-events-none rounded-lg shadow-pop hairline bg-white p-3 fade-in"
             style={{
               left: `calc(${(sx(hovered.xy.x) / W) * 100}% + 8px)`,
               top: `calc(${(sy(hovered.xy.y) / H) * 100}% - 8px)`,
               transform: 'translateY(-100%)',
               minWidth: 220,
             }}>
          <div className="flex items-center justify-between gap-3">
            <div className="text-[13px] font-semibold">{hovered.name}</div>
            <ToneChip tone={hovered.tone} />
          </div>
          <div className="grid grid-cols-2 gap-x-3 gap-y-1 mt-2 text-[11.5px]">
            <span className="text-ink-400">Customers</span>
            <span className="num text-right">{fmt(hovered.count)} ({pct(hovered.count/TOTAL_BASE*100)})</span>
            <span className="text-ink-400">Recency</span>
            <span className="num text-right">{hovered.recencyRange}</span>
            <span className="text-ink-400">Frequency</span>
            <span className="num text-right">{hovered.xy.y}{hovered.xy.y===10?'+':''} orders</span>
          </div>
          <div className="mt-2 pt-2 border-t border-canvas-200 text-[11.5px] text-ink-700">
            <span className="text-ink-400">Action · </span>{hovered.action}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- CHIPS ---------- */
function ToneChip({ tone }){
  const t = TONES[tone];
  return (
    <span className="inline-flex items-center gap-1.5 text-[11px] px-2 py-0.5 rounded-full"
      style={{ background: t.bg, color: t.text }}>
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: t.dot }}></span>
      {t.label}
    </span>
  );
}
function ActionChip({ kind }){
  const map = {
    'nurture':  { bg:'#E8EEFE', text:'#1B2A78' },
    're-engage':{ bg:'#FBEFD9', text:'#6A4708' },
    'win-back': { bg:'#FBE3E1', text:'#7A1F18' },
  };
  const c = map[kind] || map.nurture;
  return <span className="text-[11px] px-2 py-0.5 rounded-full uppercase tracking-wide" style={{ background:c.bg, color:c.text, letterSpacing:'.06em' }}>{kind}</span>;
}

/* ---------- AI CAMPAIGN WORKFLOW ---------- */
function AIWorkflow({ segment, onReset }){
  // phases: idle | thinking | draft | editing | success
  const [phase, setPhase] = useState('thinking');
  const [thoughtIdx, setThoughtIdx] = useState(0);
  const [edited, setEdited] = useState(null);

  const thoughts = [
    'Analysing segment behaviour patterns…',
    'Cross-referencing repurchase rhythm against cohort benchmarks…',
    'Matching to top-performing campaigns for similar merchants…',
    'Drafting message and calibrating offer depth…',
  ];

  useEffect(()=>{
    setPhase('thinking');
    setThoughtIdx(0);
    setEdited(null);
    const t1 = setTimeout(()=>setThoughtIdx(1), 450);
    const t2 = setTimeout(()=>setThoughtIdx(2), 900);
    const t3 = setTimeout(()=>setThoughtIdx(3), 1250);
    const t4 = setTimeout(()=>setPhase('draft'), 1600);
    return ()=>{ [t1,t2,t3,t4].forEach(clearTimeout); };
  }, [segment.id]);

  const c = segment.campaign;
  const reach = segment.count;
  const expected = Math.round(reach * c.cvr / 100);

  const fullSubject = (edited?.subject ?? c.subject);
  const fullBody    = (edited?.body    ?? c.body);

  const [subjOut, subjDone] = useTypewriter(fullSubject, 12, phase==='draft');
  const [bodyOut, bodyDone] = useTypewriter(fullBody, 6, phase==='draft' && subjDone);

  if (phase === 'thinking') {
    return (
      <div className="rounded-xl bg-ink-900 text-canvas-50 p-5 fade-in">
        <div className="flex items-center gap-3 mb-4">
          <div className="relative w-7 h-7">
            <div className="absolute inset-0 rounded-full border border-canvas-50/15"></div>
            <div className="absolute inset-0 rounded-full border-2 border-transparent border-t-canvas-50/80 ring-spin"></div>
          </div>
          <div className="text-[13px] tracking-wide uppercase text-canvas-50/60" style={{letterSpacing:'.12em'}}>RFIM · AI Campaign</div>
        </div>
        <ul className="space-y-2.5">
          {thoughts.map((t, i) => (
            <li key={i} className={`flex items-start gap-3 text-[13.5px] transition-opacity ${i <= thoughtIdx ? 'opacity-100' : 'opacity-25'}`}>
              <span className={`pulse-dot mt-2 ${i < thoughtIdx ? 'bg-emerald-400' : 'bg-canvas-50'}`}
                    style={{ animation: i === thoughtIdx ? undefined : 'none', opacity: i < thoughtIdx ? 1 : undefined }}></span>
              <span className={i < thoughtIdx ? 'text-canvas-50/70 line-through decoration-canvas-50/20' : ''}>
                {t}
              </span>
            </li>
          ))}
        </ul>
      </div>
    );
  }

  if (phase === 'success') {
    const tomorrow = '10:00 AM tomorrow';
    return (
      <div className="rounded-xl bg-white shadow-card hairline p-6 fade-in">
        <div className="flex items-start gap-3">
          <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{background:'#E3F3EA'}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4 4 10-10" stroke="#1F8A5B" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </div>
          <div className="flex-1">
            <div className="text-[15px] font-semibold">Campaign scheduled</div>
            <div className="text-[13.5px] text-ink-500 mt-1">
              <span className="num text-ink-900 font-medium">{fmt(reach)}</span> customers in <span className="font-medium text-ink-900">{segment.name}</span> will receive this message at <span className="font-medium text-ink-900">{tomorrow}</span>.
            </div>
            <div className="mt-4 flex items-center gap-3">
              <button onClick={onReset} className="text-[13px] px-3 py-1.5 rounded-md bg-ink-900 text-canvas-50 hover:bg-ink-800">Generate another</button>
              <span className="text-[12px] text-ink-400 num">Estimated additional revenue · ${fmt(Math.round(expected*78))}</span>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // draft / editing
  const channelDot = c.channel === 'EMAIL' ? '#3B5BFB' : c.channel === 'PUSH' ? '#C68A14' : '#1F8A5B';
  return (
    <div className="rounded-xl bg-white shadow-card hairline p-0 fade-in overflow-hidden">
      {/* header */}
      <div className="flex items-center justify-between px-5 py-3.5 border-b border-canvas-200">
        <div className="flex items-center gap-3">
          <span className="text-[11px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.14em'}}>AI Draft · v1</span>
          <span className="inline-flex items-center gap-1.5 text-[11px] px-2 py-0.5 rounded-full bg-canvas-100 text-ink-700">
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: channelDot }}></span>
            {c.channel}
          </span>
        </div>
        <div className="text-[11px] text-ink-400 num">{segment.name}</div>
      </div>

      {/* metrics row */}
      <div className="grid grid-cols-3 divide-x divide-canvas-200 border-b border-canvas-200">
        <div className="px-5 py-3.5">
          <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Estimated reach</div>
          <div className="num text-[18px] font-semibold mt-0.5">{fmt(reach)}</div>
        </div>
        <div className="px-5 py-3.5">
          <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Predicted CVR</div>
          <div className="num text-[18px] font-semibold mt-0.5">{c.cvr.toFixed(1)}%</div>
        </div>
        <div className="px-5 py-3.5">
          <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Expected conversions</div>
          <div className="num text-[18px] font-semibold mt-0.5">~ {fmt(expected)}</div>
        </div>
      </div>

      {/* offer */}
      <div className="px-5 pt-4">
        <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Offer</div>
        <div className="text-[13.5px] mt-1 text-ink-900">{c.offer}</div>
      </div>

      {/* content */}
      <div className="px-5 pt-4 pb-5">
        <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Subject</div>
        {phase === 'editing' ? (
          <input
            className="w-full mt-1 text-[14.5px] font-medium text-ink-900 bg-canvas-50 rounded-md px-3 py-2 hairline focus:outline-none focus:ring-2 focus:ring-accent/40"
            value={fullSubject}
            onChange={(e)=>setEdited(prev => ({ subject: e.target.value, body: prev?.body ?? c.body }))}
          />
        ) : (
          <div className={`text-[14.5px] font-medium text-ink-900 mt-1 ${!subjDone ? 'caret' : ''}`}>{subjOut || '\u00A0'}</div>
        )}

        <div className="text-[10.5px] uppercase tracking-wider text-ink-400 mt-4" style={{letterSpacing:'.12em'}}>Body</div>
        {phase === 'editing' ? (
          <textarea
            rows={5}
            className="w-full mt-1 text-[13.5px] leading-relaxed text-ink-900 bg-canvas-50 rounded-md px-3 py-2 hairline focus:outline-none focus:ring-2 focus:ring-accent/40 font-sans"
            value={fullBody}
            onChange={(e)=>setEdited(prev => ({ subject: prev?.subject ?? c.subject, body: e.target.value }))}
          />
        ) : (
          <div className={`text-[13.5px] leading-relaxed text-ink-700 mt-1 whitespace-pre-wrap ${(subjDone && !bodyDone) ? 'caret' : ''}`}>
            {bodyOut || (subjDone ? '\u00A0' : '')}
          </div>
        )}
      </div>

      {/* approval bar */}
      <div className="flex items-center justify-between px-5 py-3.5 border-t border-canvas-200 bg-canvas-50/60">
        <div className="text-[12px] text-ink-400 flex items-center gap-2">
          <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          {phase === 'editing' ? 'Editing — changes saved locally' : (bodyDone ? 'Draft ready for review' : 'AI is composing…')}
        </div>
        <div className="flex items-center gap-2">
          {phase === 'editing' ? (
            <>
              <button onClick={()=>setPhase('draft')} className="text-[13px] px-3 py-1.5 rounded-md hairline bg-white hover:bg-canvas-50">Back to draft</button>
              <button onClick={()=>setPhase('success')} className="text-[13px] px-3 py-1.5 rounded-md text-white" style={{background:'#1F8A5B'}}>Approve &amp; send</button>
            </>
          ) : (
            <>
              <button
                disabled={!bodyDone}
                onClick={()=>setPhase('editing')}
                className={`text-[13px] px-3 py-1.5 rounded-md hairline bg-white ${bodyDone ? 'hover:bg-canvas-50' : 'opacity-50 cursor-not-allowed'}`}>
                Edit before sending
              </button>
              <button
                disabled={!bodyDone}
                onClick={()=>setPhase('success')}
                className={`text-[13px] px-3 py-1.5 rounded-md text-white ${bodyDone ? '' : 'opacity-50 cursor-not-allowed'}`}
                style={{background:'#1F8A5B'}}>
                Approve &amp; send
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------- DEEP DIVE PANEL ---------- */
function DeepDive({ segment, onGenerate, generated }){
  const trend = segment.trend;
  const delta = ((trend[trend.length-1] - trend[0]) / trend[0]) * 100;
  const direction = delta >= 0 ? 'up' : 'down';
  const sparkColor = direction === 'up' ? (segment.tone === 'lost' ? '#C8392E' : '#1F8A5B') : '#C8392E';
  // Lost growing is bad; sleeping growing is bad. Color logic: for "risk"/"lost" tones, growth is red.
  const goodGrowth = !(segment.tone === 'risk' || segment.tone === 'lost');
  const finalColor = (delta >= 0)
    ? (goodGrowth ? '#1F8A5B' : '#C8392E')
    : (goodGrowth ? '#C8392E' : '#1F8A5B');

  return (
    <div className="space-y-5">
      {/* header card */}
      <div className="rounded-xl bg-white shadow-card hairline p-5">
        <div className="flex items-start justify-between gap-4">
          <div>
            <div className="flex items-center gap-2">
              <ToneChip tone={segment.tone} />
              <ActionChip kind={segment.actionType} />
            </div>
            <h3 className="text-[20px] font-semibold mt-2 leading-tight" data-comment-anchor="dd-title">{segment.name}</h3>
            <div className="text-[13px] text-ink-500 mt-1">{segment.rule}</div>
          </div>
          <div className="text-right">
            <div className="num text-[28px] font-semibold leading-none">{fmt(segment.count)}</div>
            <div className="text-[12px] text-ink-400 mt-1 num">{pct(segment.count/TOTAL_BASE*100)} of base</div>
          </div>
        </div>

        {/* metrics row */}
        <div className="grid grid-cols-3 mt-5 gap-3">
          <div className="rounded-lg bg-canvas-50 p-3 hairline">
            <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Recommended</div>
            <div className="text-[13.5px] font-medium mt-1 text-ink-900">{segment.action}</div>
          </div>
          <div className="rounded-lg bg-canvas-50 p-3 hairline">
            <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>7-mo trend</div>
            <div className={`text-[13.5px] font-medium mt-1 num`} style={{color: finalColor}}>
              {delta >= 0 ? '+' : ''}{delta.toFixed(1)}% {direction === 'up' ? '↑' : '↓'}
            </div>
          </div>
          <div className="rounded-lg bg-canvas-50 p-3 hairline">
            <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Avg. LTV</div>
            <div className="text-[13.5px] font-medium mt-1 num">${fmt(Math.round(segment.count > 1500 ? 142 : segment.tone==='top' ? 1480 : 320))}</div>
          </div>
        </div>

        {/* sparkline */}
        <div className="mt-5">
          <div className="flex items-center justify-between mb-1.5">
            <div className="text-[10.5px] uppercase tracking-wider text-ink-400" style={{letterSpacing:'.12em'}}>Customers in segment · last 7 months</div>
            <div className="text-[11px] text-ink-400 num">Apr → Oct</div>
          </div>
          <Sparkline data={trend} stroke={finalColor} fill={finalColor + '14'} w={520} h={64} />
        </div>
      </div>

      {/* CTA or workflow */}
      {!generated ? (
        <div className="rounded-xl border border-dashed border-canvas-300 p-6 flex items-center justify-between bg-canvas-50/40">
          <div>
            <div className="text-[14px] font-medium">Generate AI campaign for this segment</div>
            <div className="text-[12.5px] text-ink-500 mt-0.5">Drafts subject line, body and offer tuned to {segment.name}.</div>
          </div>
          <button
            onClick={onGenerate}
            className="text-[13px] px-4 py-2 rounded-md text-canvas-50 inline-flex items-center gap-2 hover:opacity-90"
            style={{background:'#0F1115'}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3z" fill="currentColor"/></svg>
            Generate AI campaign
          </button>
        </div>
      ) : null}
    </div>
  );
}

        </div>
        <button className="rounded-md text-[12px] px-3 py-1.5 hover:opacity-90"
                style={{ background: m.text, color: m.app }}>New campaign</button>
      </div>
    </div>
  );
}

/* ---------- APP ---------- */
function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const m = MOODS[t.mood] || MOODS.studio;
  const d = DENSITY[t.density] || DENSITY.regular;

  const [selectedId, setSelectedId] = useState('inactive_top');
  const [generated, setGenerated] = useState(false);
  const [resetKey, setResetKey] = useState(0);

  const segment = useMemo(()=>SEGMENTS.find(s=>s.id===selectedId), [selectedId]);

  useEffect(()=>{ setGenerated(false); }, [selectedId]);

  // Apply mood to body
  useEffect(()=>{
    document.body.style.background = m.app;
    document.body.style.color = m.text;
  }, [m]);

  return (
    <div className="min-h-screen flex" data-screen-label="Smart RFIM dashboard"
         style={{ background: m.app, color: m.text }}>
      <Sidebar m={m} />
      <main className="flex-1 flex flex-col">
        <Topbar m={m} view={t.view} onViewChange={(v)=>setTweak('view', v)} />
        <div className={`flex-1 grid grid-cols-12 ${d.gap} ${d.pad}`}>
          {/* LEFT — chart */}
          <section className="col-span-7" data-comment-anchor="section-1">
            <div className="rounded-xl overflow-hidden"
                 style={{ background: m.card, border: `1px solid ${m.border}`, boxShadow: '0 1px 0 rgba(0,0,0,0.03)' }}>
              <div className="px-5 py-4 border-b flex items-center justify-between" style={{ borderColor: m.border }}>
                <div>
                  <div className="text-[10.5px] uppercase tracking-wider" style={{letterSpacing:'.14em', color: m.muted}}>
                    Section 01 · {t.view === 'scatter' ? 'RFIM scatter' : 'Distribution'}
                  </div>
                  <div className={`${d.titleSize} font-semibold mt-0.5`}>
                    {t.view === 'scatter'
                      ? 'Recency × Frequency, sized by customers'
                      : 'Nine segments, sized by customer count'}
                  </div>
                </div>
                <div className="text-[11.5px] num" style={{color: m.muted}}>
                  Repurchase cycle <span className="font-semibold" style={{color:m.text}}>{REPURCHASE_CYCLE}d</span> · Base <span className="font-semibold" style={{color:m.text}}>{fmt(TOTAL_BASE)}</span>
                </div>
              </div>
              {t.view === 'scatter' ? (
                <div className="px-2 sm:px-4 py-4">
                  <RFIMScatter selectedId={selectedId} onSelect={setSelectedId} mood={t.mood} />
                </div>
              ) : (
                <div className="px-5 py-7 dotgrid">
                  <BubbleGrid selectedId={selectedId} onSelect={setSelectedId} />
                </div>
              )}
              <div className="px-5 py-3 border-t flex items-center justify-between" style={{ borderColor: m.border }}>
                <Legend />
                <div className="text-[11px]" style={{color: m.muted}}>
                  {t.view === 'scatter' ? 'Hover for detail · click to inspect →' : 'Click a bubble to inspect →'}
                </div>
              </div>
            </div>

            {/* RFIM dimension primer */}
            <div className="mt-6 grid grid-cols-4 gap-3">
              {[
                ['R','Recency','Days since last order, as a multiple of your own cycle'],
                ['F','Frequency','Lifetime purchase count'],
                ['I','Interaction','Browsing without buying — leading intent signal'],
                ['M','Monetary','Top 10% LTV gate'],
              ].map(([k,tl,desc])=>(
                <div key={k} className="rounded-lg p-3"
                     style={{ background: m.card, border: `1px solid ${m.border}` }}>
                  <div className="flex items-center gap-2">
                    <span className="num text-[11px] w-5 h-5 rounded inline-flex items-center justify-center font-semibold"
                          style={{ background: m.subBg, color: m.text }}>{k}</span>
                    <span className="text-[12.5px] font-medium">{tl}</span>
                  </div>
                  <div className="text-[11.5px] mt-1.5 leading-snug" style={{color: m.muted}}>{desc}</div>
                </div>
              ))}
            </div>
          </section>

          {/* RIGHT — deep dive + AI */}
          <section className="col-span-5 space-y-5" data-comment-anchor="section-2">
            <div className="flex items-center justify-between">
              <div className="text-[10.5px] uppercase tracking-wider" style={{letterSpacing:'.14em', color: m.muted}}>Section 02 · Deep dive</div>
              <button
                className="text-[11px] num hover:opacity-80"
                style={{color: m.muted}}
                onClick={()=>setSelectedId('ready')}>
                Reset selection
              </button>
            </div>

            <DeepDive
              key={segment.id}
              segment={segment}
              generated={generated}
              onGenerate={()=>{ setGenerated(true); setResetKey(k=>k+1); }}
            />

            {generated && (
              <div data-comment-anchor="section-3">
                <div className="text-[10.5px] uppercase tracking-wider mb-2" style={{letterSpacing:'.14em', color: m.muted}}>Section 03 · AI campaign</div>
                <AIWorkflow
                  key={segment.id + ':' + resetKey}
                  segment={segment}
                  onReset={()=>{ setGenerated(false); }}
                />
              </div>
            )}
          </section>
        </div>

        <footer className="px-8 py-4 border-t text-[11px] flex items-center justify-between"
                style={{ borderColor: m.border, color: m.muted }}>
          <span>Smart RFIM · personalised dormancy windows · prototype</span>
          <span className="num">{fmt(TOTAL_BASE)} customers analysed · cycle {REPURCHASE_CYCLE}d</span>
        </footer>
      </main>

      {/* Tweaks panel */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="View" />
        <TweakRadio
          label="Section 01 chart"
          value={t.view}
          options={[
            { value: 'grid',    label: 'Bubble grid' },
            { value: 'scatter', label: 'RFIM scatter' },
          ]}
          onChange={(v)=>setTweak('view', v)}
        />
        <TweakSection label="Mood" />
        <TweakRadio
          label="Theme"
          value={t.mood}
          options={[
            { value: 'studio',   label: 'Studio' },
            { value: 'paper',    label: 'Paper' },
            { value: 'midnight', label: 'Midnight' },
          ]}
          onChange={(v)=>setTweak('mood', v)}
        />
        <TweakRadio
          label="Density"
          value={t.density}
          options={['compact', 'regular', 'airy']}
          onChange={(v)=>setTweak('density', v)}
        />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
